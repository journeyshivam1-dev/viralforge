services:
  redis:
    image: redis:7-alpine
    container_name: viralforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - viralforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: viralforge-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128
      PUBLISHING_DISABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: viralforge-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: http://host.docker.internal:54321
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128
      PUBLISHING_DISABLED: "true"
      API_URL: http://api:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped

  dashboard:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
      args:
        API_URL: http://api:3000
    container_name: viralforge-dashboard
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: viralforge-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - viralforge-network
    profiles:
      - monitoring

volumes:
  redis_data:

networks:
  viralforge-network:
    driver: bridge
