version: '3.8'

services:
  # PostgreSQL database (Supabase)
  postgres:
    image: postgres:16-alpine
    container_name: viralforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viralforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralforge}
      POSTGRES_DB: ${POSTGRES_DB:-viralforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - viralforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: viralforge-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - viralforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Minio (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: viralforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - viralforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # API Service
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: viralforge-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-viralforge}:${POSTGRES_PASSWORD:-viralforge}@postgres:5432/${POSTGRES_DB:-viralforge}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: viralforge-content
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped

  # Worker Service (BullMQ)
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: viralforge-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-viralforge}:${POSTGRES_PASSWORD:-viralforge}@postgres:5432/${POSTGRES_DB:-viralforge}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: viralforge-content
      CONTENT_GENERATION_PROVIDER: omniroute
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped
    deploy:
      replicas: 4

  # Dashboard (Next.js)
  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: viralforge-dashboard
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - viralforge-network
    restart: unless-stopped

  # Redis Commander (optional - monitoring)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: viralforge-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - viralforge-network
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  viralforge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/16